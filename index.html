<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeeInvest</title>
    <meta name="description" content="Investment Slider Project" />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <!-- PWA Configuration -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="%BASE_URL%icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%BASE_URL%icon-512x512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Restaure l'URL après une redirection 404 (SPA sur GitHub Pages) -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
